[package]
name = "mono-pack"
version = "1.0.0"
edition = "2021"
license = "MIT"

[lib]
name = "mono_pack"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
webp = "0.3"
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
